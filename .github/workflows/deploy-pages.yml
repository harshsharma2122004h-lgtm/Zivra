name: Deploy ZIVRA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production-readiness branch
        uses: actions/checkout@v4
      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html admin.html preview.html supabase-config.js _site/
          cp about.html account.html track-order.html size-guide.html shipping-returns.html faq.html privacy-policy.html contact.html help-center.html _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-email-function:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout repository
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy ZIVRA email function
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase functions deploy send-order-email --project-ref pkraituxrivliqavzwgsm
